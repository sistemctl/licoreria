# Contenedor de PostgreSQL INDEPENDIENTE (solo base de datos).
# Úsalo en local o como referencia; en Dokploy crea la DB desde Databases.

name: licoreria-db

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licoreria_secret}
      POSTGRES_DB: ${POSTGRES_DB:-licoreria_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
